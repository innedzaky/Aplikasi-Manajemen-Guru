name: Sync AI Studio to Cloudflare Repo

on:
  push:
    branches:
      - main

jobs:
  sync-to-b:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to Repo B
        env:
          DEST_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          git remote add target "https://dzakyinne-gif:${DEST_TOKEN}@github.com/dzakyinne-gif/sistem-manajemen-guru.git"
          git push --force --prune target main:main
