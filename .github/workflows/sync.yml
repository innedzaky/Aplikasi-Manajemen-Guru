name: Sync AI Studio to Cloudflare Repo

on:
  push:
    branches:
      - main

jobs:
  sync-to-b:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to Repo B
        env:
          DEST_TOKEN: ${{ secrets.SYNC_AI_TO_CLOUDFLARE }}
        run: |
          git -c http.extraheader="AUTHORIZATION: basic $(echo -n "dzakyinne-gif:${DEST_TOKEN}" | base64)" push --force --prune https://github.com/dzakyinne-gif/sistem-manajemen-guru.git main:main
